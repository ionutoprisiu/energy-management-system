services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: user_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  device-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: device_db
    volumes:
      - device_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d device_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@auth-db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"
    depends_on:
      auth-db:
        condition: service_healthy

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@user-db:5432/user_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-min-32-chars}
      ALGORITHM: HS256
    ports:
      - "8001:8001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=PathPrefix(`/users`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.services.users.loadbalancer.server.port=8001"
    depends_on:
      user-db:
        condition: service_healthy

  device-service:
    build: ./device-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@device-db:5432/device_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-min-32-chars}
      ALGORITHM: HS256
    ports:
      - "8002:8002"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devices.rule=PathPrefix(`/devices`)"
      - "traefik.http.routers.devices.entrypoints=web"
      - "traefik.http.services.devices.loadbalancer.server.port=8002"
    depends_on:
      device-db:
        condition: service_healthy

  traefik:
    image: traefik:latest
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - "/Users/ionut/.docker/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  auth_db_data:
  user_db_data:
  device_db_data: